name: Set up Go with a workload cache
description: Retain the compiled outputs produced by each CI workload.
inputs:
  workload:
    description: Stable compilation workload, distinct for each matrix entry.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        printf 'build-cache=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        printf 'module-cache=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    # A dependency-only key lets the fastest job freeze a partial build cache.
    # Restore compatible work everywhere; only main pushes save, so PR entries
    # cannot evict main's warm set.
    - name: Cache Go compilation
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.paths.outputs.build-cache }}
          ${{ steps.paths.outputs.module-cache }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum') }}-

    - name: Restore Go compilation
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.paths.outputs.build-cache }}
          ${{ steps.paths.outputs.module-cache }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum') }}-
